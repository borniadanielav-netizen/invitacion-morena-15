<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06152e">

<title>More · Mis 15 años</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #06152e;
  color: white;
  overflow-x: hidden;
}


/* =====================================================
   APERTURA
===================================================== */

.opening-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(54,111,181,.65),
      transparent 38%
    ),
    radial-gradient(
      circle at 15% 20%,
      rgba(213,222,235,.16),
      transparent 20%
    ),
    linear-gradient(
      145deg,
      #020a1b 0%,
      #0b2854 50%,
      #020a1b 100%
    );
}

.opening-content {
  position: relative;
  z-index: 100;

  width: 90%;
  max-width: 650px;
}

.crown {
  font-size: 48px;

  color: #edf2f8;

  text-shadow:
    0 0 5px #fff,
    0 0 15px #d7e0ea,
    0 0 35px #8ea9c9;

  animation:
    crownGlow 2.5s ease-in-out infinite alternate;
}

@keyframes crownGlow {

  from {
    transform: scale(1);
    filter: brightness(.9);
  }

  to {
    transform: scale(1.08);
    filter: brightness(1.4);
  }

}

.opening-small {

  margin-top: 10px;

  font-size: 14px;
  letter-spacing: 5px;

  color: #dfe7f1;

  text-transform: uppercase;
}

.opening-name {

  margin-top: 15px;

  font-size: clamp(70px,18vw,135px);

  font-style: italic;
  font-weight: normal;

  line-height: .9;

  color: white;

  text-shadow:
    0 0 3px #fff,
    0 0 9px #fff,
    0 0 20px #d5dfeb,
    0 0 40px #7d9fc6;
}

.opening-title {

  margin-top: 25px;

  font-size: clamp(23px,6vw,40px);

  letter-spacing: 8px;

  color: #e3eaf2;

  text-shadow:
    0 0 5px white,
    0 0 15px #b8c9dc;
}

.open-button {

  margin-top: 38px;

  padding: 15px 35px;

  border: 1px solid rgba(240,245,250,.8);
  border-radius: 40px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.18),
      rgba(75,117,163,.2)
    );

  color: white;

  font-family: Georgia, serif;

  font-size: 15px;
  letter-spacing: 3px;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(255,255,255,.25),
    inset 0 0 15px rgba(255,255,255,.08);

  transition: .4s;
}

.open-button:hover {

  transform: scale(1.07);

  box-shadow:
    0 0 20px rgba(255,255,255,.5),
    0 0 40px rgba(100,150,205,.4);
}


/* =====================================================
   MARIPOSAS
===================================================== */

.butterfly {

  position: absolute;

  width: 90px;
  height: 90px;

  z-index: 15;

  pointer-events: none;

  animation:
    butterflyMove 12s ease-in-out infinite,
    butterflyGlow 2.8s ease-in-out infinite alternate;
}

.butterfly svg {

  width: 100%;
  height: 100%;

  overflow: visible;
}

.butterfly.small {

  width: 55px;
  height: 55px;
}

.butterfly.large {

  width: 125px;
  height: 125px;
}


/* =====================================================
   POSICIONES
===================================================== */

.butterfly-1 {

  left: 4%;
  top: 10%;

  animation-delay: -2s;
}

.butterfly-2 {

  right: 7%;
  top: 12%;

  animation-delay: -7s;
}

.butterfly-3 {

  left: 13%;
  top: 42%;

  animation-delay: -4s;
}

.butterfly-4 {

  right: 10%;
  top: 38%;

  animation-delay: -9s;
}

.butterfly-5 {

  left: 3%;
  bottom: 8%;

  animation-delay: -6s;
}

.butterfly-6 {

  right: 3%;
  bottom: 10%;

  animation-delay: -1s;
}

.butterfly-7 {

  left: 42%;
  top: 8%;

  animation-delay: -11s;
}

.butterfly-8 {

  right: 35%;
  bottom: 7%;

  animation-delay: -5s;
}


/* MÁS MARIPOSAS */

.butterfly-9 {

  left: 25%;
  top: 20%;

  animation-delay: -3s;
  transform: scale(.65);
}

.butterfly-10 {

  right: 25%;
  top: 30%;

  animation-delay: -8s;
  transform: scale(.75);
}

.butterfly-11 {

  left: 32%;
  bottom: 18%;

  animation-delay: -10s;
  transform: scale(.55);
}

.butterfly-12 {

  right: 17%;
  bottom: 28%;

  animation-delay: -2s;
  transform: scale(.6);
}

.butterfly-13 {

  left: 6%;
  top: 68%;

  animation-delay: -12s;
  transform: scale(.5);
}

.butterfly-14 {

  right: 4%;
  top: 72%;

  animation-delay: -5s;
  transform: scale(.55);
}


@keyframes butterflyMove {

  0% {

    transform:
      translate(0,20px)
      rotate(-8deg);

  }

  25% {

    transform:
      translate(35px,-30px)
      rotate(7deg);

  }

  50% {

    transform:
      translate(-20px,-65px)
      rotate(-5deg);

  }

  75% {

    transform:
      translate(40px,-35px)
      rotate(8deg);

  }

  100% {

    transform:
      translate(0,20px)
      rotate(-8deg);

  }

}


@keyframes butterflyGlow {

  from {

    filter:
      drop-shadow(
        0 0 3px rgba(255,255,255,.5)
      )
      drop-shadow(
        0 0 5px rgba(68,126,190,.4)
      );

  }

  to {

    filter:
      drop-shadow(
        0 0 7px rgba(255,255,255,.95)
      )
      drop-shadow(
        0 0 20px rgba(84,145,214,.85)
      );

  }

}


/* =====================================================
   DESTELLOS MÁGICOS
===================================================== */

.sparkle {

  position: absolute;

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 0 5px white,
    0 0 13px #c9d8e8,
    0 0 22px rgba(120,170,220,.8);

  animation:
    sparkle 2s infinite alternate;

  z-index: 8;
}

.sparkle.big {

  width: 6px;
  height: 6px;

  box-shadow:
    0 0 7px white,
    0 0 18px #dce8f5,
    0 0 30px #75a8dc;
}

.s1 { left:18%; top:25%; }
.s2 { left:72%; top:25%; animation-delay:.7s; }
.s3 { left:32%; top:72%; animation-delay:1.2s; }
.s4 { left:90%; top:70%; animation-delay:.4s; }
.s5 { left:10%; top:60%; animation-delay:1.7s; }
.s6 { left:58%; top:15%; animation-delay:.9s; }

@keyframes sparkle {

  from {

    transform: scale(.3);
    opacity: .2;

  }

  to {

    transform: scale(1.8);
    opacity: 1;

  }

}


/* =====================================================
   HERO
===================================================== */

.hero {

  min-height: 100vh;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  overflow: hidden;

  background:

    radial-gradient(
      circle at center,
      rgba(44,91,148,.7),
      transparent 45%
    ),

    linear-gradient(
      160deg,
      #06152e,
      #123967,
      #06152e
    );
}

.hero-content {

  position: relative;

  z-index: 30;

  padding: 30px;
}

.hero-small {

  font-size: 15px;

  letter-spacing: 6px;

  color: #dbe4ef;

  margin-bottom: 20px;
}

.hero-name {

  font-size: clamp(75px,20vw,150px);

  font-style: italic;
  font-weight: normal;

  line-height: .85;

  color: white;

  text-shadow:
    0 0 3px white,
    0 0 10px white,
    0 0 25px #d1dce8,
    0 0 45px rgba(161,190,222,.8);
}

.hero-date {

  margin-top: 30px;

  font-size: 17px;

  letter-spacing: 4px;

  color: white;
}


/* =====================================================
   SECCIONES
===================================================== */

section {

  position: relative;

  overflow: hidden;

  padding: 80px 20px;
}

.section-inner {

  width: 100%;

  max-width: 900px;

  margin: auto;

  position: relative;

  z-index: 20;
}

.section-title {

  margin-bottom: 35px;

  text-align: center;

  font-size: 32px;

  font-weight: normal;

  letter-spacing: 4px;

  color: #e3e9f1;

  text-shadow:
    0 0 8px rgba(255,255,255,.7),
    0 0 18px rgba(167,190,215,.7);
}

.story {

  max-width: 780px;

  margin: auto;

  text-align: center;

  font-size: 18px;

  line-height: 2;

  color: #edf2f7;
}


/* =====================================================
   GALERÍA
===================================================== */

.gallery {

  position: relative;

  display: grid;

  grid-template-columns: repeat(2,1fr);

  gap: 25px;

  max-width: 850px;

  margin: auto;
}

.photo-frame {

  position: relative;

  min-height: 450px;

  padding: 0;

  border: none;

  border-radius: 18px;

  background: transparent;

  box-shadow: none;

  overflow: visible;
}

.photo-frame img {

  width: 100%;

  height: 100%;

  min-height: 430px;

  display: block;

  object-fit: contain;

  object-position: center;

  border-radius: 14px;

  background: transparent;

  position: relative;

  z-index: 5;

  filter:
    drop-shadow(
      0 8px 20px rgba(0,0,0,.35)
    );
}


/* MARIPOSAS ALREDEDOR DE LAS FOTOS */

.photo-butterfly {

  position: absolute;

  width: 55px;
  height: 55px;

  z-index: 10;

  pointer-events: none;

  animation:
    photoButterfly 8s ease-in-out infinite,
    butterflyGlow 2.8s ease-in-out infinite alternate;
}

.photo-butterfly svg {

  width: 100%;
  height: 100%;
}

.pb1 {
  left: -20px;
  top: 8%;
}

.pb2 {
  right: -20px;
  bottom: 8%;
  animation-delay: -3s;
}

.pb3 {
  right: 4%;
  top: 5%;
  width: 45px;
  height: 45px;
  animation-delay: -5s;
}

.pb4 {
  left: 0;
  bottom: 5%;
  width: 42px;
  height: 42px;
  animation-delay: -1s;
}

@keyframes photoButterfly {

  0% {
    transform: translate(0,0) rotate(-7deg);
  }

  50% {
    transform: translate(18px,-25px) rotate(8deg);
  }

  100% {
    transform: translate(0,0) rotate(-7deg);
  }

}


/* =====================================================
   COMPARTIR FOTOS Y VIDEOS
===================================================== */

.photos-share {

  max-width: 720px;

  margin: auto;

  padding: 38px 25px;

  text-align: center;

  border: 1px solid rgba(218,228,239,.4);

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.08),
      rgba(58,93,130,.12)
    );

  box-shadow:
    0 0 30px rgba(109,143,181,.12);
}

.photos-icon {

  font-size: 45px;

  margin-bottom: 18px;

  text-shadow:
    0 0 8px rgba(255,255,255,.7),
    0 0 20px rgba(117,170,225,.7);
}

.photos-text {

  max-width: 570px;

  margin: auto;

  font-size: 18px;

  line-height: 1.8;

  color: #e7edf4;
}

.photos-button {

  display: inline-block;

  margin-top: 25px;

  padding: 15px 28px;

  border: 1px solid rgba(235,242,249,.7);

  border-radius: 35px;

  background:
    linear-gradient(
      135deg,
      #183f70,
      #315f91
    );

  color: white;

  text-decoration: none;

  font-family: Georgia, serif;

  letter-spacing: 1px;

  box-shadow:
    0 0 18px rgba(111,153,199,.25);

  transition: .3s;
}

.photos-button:hover {

  transform: translateY(-3px) scale(1.03);

  box-shadow:
    0 0 25px rgba(150,190,230,.4);
}

.photos-note {

  margin-top: 16px;

  font-size: 13px;

  color: #b9c7d7;

  opacity: .85;
}


/* =====================================================
   EVENTO
===================================================== */

.event-card {

  max-width: 720px;

  margin: auto;

  padding: 35px 25px;

  text-align: center;

  border: 1px solid rgba(218,228,239,.4);

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.08),
      rgba(58,93,130,.12)
    );

  box-shadow:
    0 0 30px rgba(109,143,181,.12);
}

.event-date {

  font-size: 30px;

  color: #f1f4f8;

  margin-bottom: 15px;
}

.event-time {

  font-size: 21px;

  line-height: 1.8;

  color: #cbd6e4;
}

.event-place {

  margin-top: 25px;

  font-size: 19px;

  line-height: 1.7;

  color: #eef2f7;
}


/* =====================================================
   BOTONES
===================================================== */

.buttons {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 15px;

  margin-top: 30px;
}

.btn {

  display: inline-block;

  padding: 13px 23px;

  border: 1px solid rgba(229,236,244,.7);

  border-radius: 30px;

  color: white;

  background: rgba(255,255,255,.08);

  text-decoration: none;

  letter-spacing: 1px;

  transition: .3s;
}

.btn:hover {

  transform: translateY(-3px);

  background: rgba(255,255,255,.16);

  box-shadow:
    0 0 18px rgba(211,225,240,.25);
}


/* =====================================================
   IMPORTANTE
===================================================== */

.important-section {

  text-align: center;

  padding-top: 55px;
  padding-bottom: 65px;

  background:
    radial-gradient(
      circle at center,
      rgba(45,92,148,.25),
      transparent 55%
    );
}

.important-crown {

  font-size: 58px;

  color: #f4f7fb;

  margin-bottom: 20px;

  text-shadow:
    0 0 5px white,
    0 0 12px #dce5ef,
    0 0 25px #8daed0,
    0 0 45px #5d8fc4;

  animation:
    crownGlow 2s ease-in-out infinite alternate;
}

.important-title {

  font-size: 14px;

  letter-spacing: 5px;

  color: #d6e0eb;

  margin-bottom: 18px;

  text-transform: uppercase;
}

.important-text {

  max-width: 650px;

  margin: auto;

  font-size: 20px;

  line-height: 1.7;

  color: white;

  text-shadow:
    0 0 8px rgba(255,255,255,.25);
}

.important-text strong {

  color: #8fc5ff;

  text-shadow:
    0 0 8px #5c9ddd,
    0 0 18px rgba(107,168,229,.7);
}


/* =====================================================
   DRESS CODE
===================================================== */

.dress {

  max-width: 720px;

  margin: auto;

  text-align: center;
}

.dress-main {

  margin-bottom: 20px;

  font-size: 25px;

  color: #e6ebf1;
}

.dress-text {

  font-size: 18px;

  line-height: 1.9;

  color: #e4eaf1;
}

.mate-important {

  margin-top: 28px;

  padding: 17px 20px;

  border-top: 1px solid rgba(215,226,239,.3);

  border-bottom: 1px solid rgba(215,226,239,.3);

  color: #edf3f9;

  font-size: 18px;

  letter-spacing: .5px;
}

.mate-important strong {

  color: #fff;

  text-shadow:
    0 0 7px rgba(255,255,255,.5);
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

  display: grid;

  grid-template-columns: repeat(4,1fr);

  gap: 12px;

  max-width: 650px;

  margin: auto;
}

.count-box {

  padding: 22px 8px;

  border: 1px solid rgba(220,229,239,.35);

  border-radius: 16px;

  background: rgba(255,255,255,.06);

  text-align: center;
}

.count-number {

  display: block;

  font-size: 34px;

  color: white;
}

.count-label {

  font-size: 11px;

  letter-spacing: 2px;

  color: #bdc9d8;
}


/* =====================================================
   ALIAS
===================================================== */

.alias-box {

  max-width: 600px;

  margin: auto;

  text-align: center;
}

.alias-intro {

  max-width: 650px;

  margin: auto;

  font-size: 18px;

  line-height: 1.9;

  color: #e4eaf1;
}

.gift-options {

  margin: 25px 0 10px;

  font-size: 32px;

  letter-spacing: 12px;
}

.alias {

  display: inline-block;

  margin: 20px auto;

  padding: 18px 25px;

  border: 1px solid rgba(226,234,243,.45);

  border-radius: 15px;

  font-size: 22px;

  letter-spacing: 2px;

  color: white;

  background: rgba(255,255,255,.07);
}

.copy-btn {

  padding: 12px 25px;

  border: 1px solid rgba(229,237,245,.7);

  border-radius: 25px;

  background: transparent;

  color: white;

  font-family: Georgia, serif;

  cursor: pointer;

  transition: .3s;
}

.copy-btn:hover {

  background: rgba(255,255,255,.12);
}


/* =====================================================
   WHATSAPP
===================================================== */

.confirm {

  text-align: center;
}

.whatsapp {

  display: inline-block;

  margin-top: 20px;

  padding: 16px 30px;

  border-radius: 35px;

  border: 1px solid rgba(235,242,249,.6);

  background:
    linear-gradient(
      135deg,
      #183f70,
      #315f91
    );

  color: white;

  text-decoration: none;

  letter-spacing: 1px;

  box-shadow:
    0 0 18px rgba(111,153,199,.25);

  transition: .3s;
}

.whatsapp:hover {

  transform: scale(1.04);
}


/* =====================================================
   MÚSICA
===================================================== */

.music-button {

  position: fixed;

  right: 18px;
  bottom: 18px;

  z-index: 9000;

  width: 50px;
  height: 50px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.7);

  background: rgba(6,21,46,.85);

  color: white;

  font-size: 20px;

  cursor: pointer;

  box-shadow:
    0 0 15px rgba(180,204,229,.3);
}


/* =====================================================
   FOOTER
===================================================== */

footer {

  padding: 45px 20px;

  text-align: center;

  color: #aebdce;

  font-size: 13px;

  line-height: 1.8;

  background: #030d20;

  border-top:
    1px solid rgba(214,224,235,.12);
}


/* =====================================================
   FADE
===================================================== */

.fade {

  opacity: 0;

  transform: translateY(25px);

  transition: 1s ease;
}

.fade.show {

  opacity: 1;

  transform: translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:650px) {

  .opening-name {
    font-size: 75px;
  }

  .opening-title {
    letter-spacing: 5px;
  }

  .butterfly {
    width: 65px;
    height: 65px;
  }

  .butterfly.large {
    width: 90px;
    height: 90px;
  }

  .gallery {
    grid-template-columns: 1fr;
  }

  .photo-frame {
    min-height: 400px;
  }

  .photo-frame img {
    min-height: 380px;
  }

  .countdown {
    grid-template-columns: repeat(2,1fr);
  }

  .story {
    font-size: 17px;
  }

  section {
    padding: 65px 18px;
  }

  .important-text {
    font-size: 18px;
  }

}

</style>
</head>

<div class="butterfly butterfly-2 large">

<svg viewBox="0 0 120 120">

<defs>

<linearGradient
